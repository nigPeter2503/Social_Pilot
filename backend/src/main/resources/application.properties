server.error.include-message=never
socialpilot.facebook.app-id=${FACEBOOK_APP_ID:}
socialpilot.facebook.app-secret=${FACEBOOK_APP_SECRET:}
socialpilot.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:}
socialpilot.facebook.target-page-id=${FACEBOOK_TARGET_PAGE_ID:}
socialpilot.facebook.graph-api-version=${FACEBOOK_GRAPH_API_VERSION:v27.0}

socialpilot.facebook.enabled=${FACEBOOK_OAUTH_ENABLED:true}
socialpilot.linkedin.enabled=${LINKEDIN_OAUTH_ENABLED:false}
socialpilot.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
socialpilot.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
socialpilot.linkedin.redirect-uri=${LINKEDIN_OAUTH_REDIRECT_URI:}
