plugins { id 'com.android.application' }
def oauthApiBaseUrl = providers.gradleProperty('socialpilotOauthApiBaseUrl').getOrElse(
        System.getenv('SOCIALPILOT_OAUTH_API_BASE_URL') ?: 'https://127.0.0.1/')
def linkedinApiVersion = providers.gradleProperty('socialpilotLinkedinApiVersion').getOrElse(System.getenv('LINKEDIN_API_VERSION') ?: '')
if (!(linkedinApiVersion ==~ /[0-9]{6}/) && !linkedinApiVersion.isEmpty()) { throw new GradleException('LinkedIn API version must be YYYYMM') }

def escapedOauthApiBaseUrl = oauthApiBaseUrl.replace('\\', '\\\\').replace('"', '\\"')
android {
    namespace 'com.socialpilot.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.socialpilot.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'OAUTH_API_BASE_URL', '"' + escapedOauthApiBaseUrl + '"'
        buildConfigField 'String', 'LINKEDIN_API_VERSION', '"' + linkedinApiVersion + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions { annotationProcessorOptions {
            arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
        } }
    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.10.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    androidTestImplementation 'androidx.work:work-testing:2.10.1'
}
